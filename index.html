<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>東方獣王園</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="standalone.css"></head>
<body>
<p id="loading" role="status">正在准备兽王园……</p><p id="error" role="alert"></p>
<nav id="toolbar" aria-label="操作说明"><button id="touch-toggle" type="button" aria-pressed="false">触屏按键</button><details><summary>按键说明</summary><p>方向键移动 · Z 射击 / 确认 · Shift 低速 · X 按住蓄力，松开释放 · C Bomb · Esc 暂停 / 返回。</p><p>触屏：拖动游戏画面移动，点击画面确认；也可用左下方向键和右下操作键。对局默认双方各 5 条命，生命数统一调整，无时间限制，手动蓄力恢复屏障。</p></details></nav>
<div id="touch-controls" aria-label="兽王园触屏操作" hidden>
 <div id="dpad" aria-label="方向键"><button type="button" data-key="ArrowUp" aria-label="向上">↑</button><button type="button" data-key="ArrowLeft" aria-label="向左">←</button><button type="button" data-key="ArrowDown" aria-label="向下">↓</button><button type="button" data-key="ArrowRight" aria-label="向右">→</button></div>
 <div id="actions"><button type="button" data-key="Escape">Esc<br>暂停 / 返回</button><button type="button" data-key="ShiftLeft">Shift<br>低速</button><button type="button" data-key="KeyC">C<br>Bomb</button><button type="button" data-key="KeyZ">Z<br>射击 / 确认</button><button type="button" data-key="KeyX" class="charge">X<br>蓄力</button></div>
</div>
<script type="module" src="standalone.mjs"></script></body></html>
